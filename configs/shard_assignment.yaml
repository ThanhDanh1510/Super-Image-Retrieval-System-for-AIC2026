# =============================================================================
# configs/shard_assignment.yaml — Map member → danh sách video_id phụ trách
# =============================================================================
#
# QUY TẮC BẮT BUỘC:
#   - Không được có 1 video_id xuất hiện ở 2 member khác nhau.
#   - Không được bỏ sót video_id nào trong tổng dataset.
#   - Khi thêm video mới, chỉ append vào member phụ trách — không sửa video đã assign.
#   - aggregation/verify_shards.py sẽ validate file này trước khi merge.
#
# FORMAT:
#   members:
#     <member_name>:
#       dataset_name: "aic2026-shard-<member>-v<n>"  # Kaggle Dataset name khi publish
#       video_ids: [L01_V001, L01_V002, ...]
#
# =============================================================================

schema_version: "1.0.0"

# Tổng số video trong dataset (dùng để verify_shards.py check không bỏ sót)
total_videos_expected: 0   # TODO: Điền vào khi BTC công bố dataset chính thức

members:
  # -------------------------------------------------------------------------
  # Thêm member vào đây theo template bên dưới
  # -------------------------------------------------------------------------

  member_a:
    dataset_name: "aic2026-shard-member-a-v1"   # Tên Kaggle Dataset khi publish
    video_ids: []
    # Ví dụ: [L01_V001, L01_V002, L01_V003, ...]

  member_b:
    dataset_name: "aic2026-shard-member-b-v1"
    video_ids: []

  member_c:
    dataset_name: "aic2026-shard-member-c-v1"
    video_ids: []

  member_d:
    dataset_name: "aic2026-shard-member-d-v1"
    video_ids: []

  member_e:
    dataset_name: "aic2026-shard-member-e-v1"
    video_ids: []

# Dataset thống nhất sau khi aggregation/ merge xong (dùng cho indexing/)
unified_dataset_name: "aic2026-unified-v1"
