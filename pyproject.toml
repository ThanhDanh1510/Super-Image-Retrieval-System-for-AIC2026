[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "aic2026"
version = "0.1.0"
description = "Super Image Retrieval System — AI Challenge HCMC 2026"
requires-python = ">=3.10"

dependencies = [
    # Vector DB
    "qdrant-client>=1.9.0",

    # ML / Embeddings
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",

    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",    # for file upload (image, audio)

    # Config & Utils
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
ingestion = [
    # Kaggle-only, không dùng trong serving
    "paddlepaddle-gpu",
    "paddleocr>=2.8.0",
    "faster-whisper>=1.0.0",
    "underthesea>=6.8.0",
]

dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",             # TestClient cho FastAPI
    "ruff>=0.4.0",               # linter
    "mypy>=1.10.0",              # type checking
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "serving*", "ingestion*", "indexing*", "aggregation*", "eval*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]